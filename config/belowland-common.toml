
[events]
	#Events per day in Phase 1 (Day 2-3: MINIMAL only - chat messages, ambience)
	#Range: 0 ~ 50000
	eventsPhase1 = 6
	#Events per day in Phase 2 (around Day 4-5: MINIMAL + MEDIUM - interact with player)
	#Range: 0 ~ 50000
	eventsPhase2 = 9
	#Events per day in Phase 3 (around Day 6+: all tiers including HARD - dangerous entities)
	#Range: 0 ~ 50000
	eventsPhase3 = 12
	#If true, events only fire when player can see the sky
	requireSurface = true
	#MINIMAL-tier events that must fire before Phase 2 can start (was 6 hardcoded; raised for slower pacing)
	#Range: 1 ~ 1000
	minimalEventsToPhase2 = 12
	#MEDIUM-tier events that must fire before Phase 3 can start (was 2 hardcoded; raised for slower pacing)
	#Range: 1 ~ 1000
	mediumEventsToPhase3 = 8
	#Earliest in-game day Phase 2 can start, regardless of event count. Day 0 is the day the world began.
	#Range: 0 ~ 1000
	minDayPhase2 = 3
	#Earliest in-game day Phase 3 can start, regardless of event count.
	#Range: 0 ~ 1000
	minDayPhase3 = 5

[house]
	#Player-placed blocks within radius needed to mark a house
	#Range: 5 ~ 1000
	blockThreshold = 10
	#Radius (blocks) used to cluster placements into a single house
	#Range: 4 ~ 64
	clusterRadius = 16

[zzzzzz]
	#How many zzzzzz spawn per event
	#Range: 1 ~ 16
	spawnCount = 3
	#Total blocks the group will steal before leaving
	#Range: 1 ~ 1024
	blocksToTake = 64
	#Distance from house at which zzzzzz spawn (blocks)
	#Range: 8 ~ 96
	spawnRadius = 24

[alpha_visuals]
	#Alpha-style grayscale lightmap with 0.8^(15-x) brightness curve. Pre-Beta 1.8 look.
	alphaLightingEnabled = false
	#Disable smooth lighting / ambient occlusion. Pre-Beta 1.3 look.
	disableAmbientOcclusion = false
	#Brightness falloff per light level. 0.8 = alpha. Lower = darker caves, higher = brighter.
	#Range: 0.5 ~ 0.99
	falloff = 0.8
	#Falloff in Nether. Alpha used 0.9 so it never went pitch black there.
	#Range: 0.5 ~ 0.99
	netherFalloff = 0.9

